<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastreamento de Encomendas</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      max-width: 500px;
      margin: 100px auto;
      background-color: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      color: #222;
      margin-bottom: 15px;
    }

    p {
      font-size: 15px;
      color: #555;
      margin-bottom: 25px;
    }

    .btn-acesso {
      display: inline-block;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background-color: #3366cc;
      border: none;
      border-radius: 4px;
      text-decoration: none;
      transition: background 0.3s ease;
    }

    .btn-acesso:hover {
      background-color: #254a99;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Consultar Rastreamento de Encomenda</h1>
    <p>Clique no botão abaixo para acessar o serviço oficial de rastreamento.</p>
    <a href="https://www.lfood.site/rastreio/" target="_blank" rel="noopener noreferrer" class="btn-acesso">
      Acessar Site Oficial
    </a>
  </div>
</body>
</html>
